name: Deploy to staging gcp artifact registry

on:
  push:
    branches:
      - main
      - develop

env:
  DEPLOY_ENV: staging

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: ${{ steps.deploy-to-staging.outputs.page_url }}

    steps:
      - uses: actions/checkout@v3

      - name: install the gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: build and push docker image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev
          docker build -t asia-east1-docker.pkg.dev/${GCP_PROJECT_ID}/blipin-backend/blipin-backend:latest .
          docker push asia-east1-docker.pkg.dev/${GCP_PROJECT_ID}/blipin-backend/blipin-backend:latest
